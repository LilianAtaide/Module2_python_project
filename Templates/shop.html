{% extends "base.html" %}

{% block title %}Shop | Nairim's Cuties{% endblock %}

{% block content %}

<h2 class="section-title">Our Collection</h2>

<div class="product-grid">
    {% for item in products %}
    <div class="product-card">
    <img src="{{ url_for('static', filename='images/' + item.image) }}" alt="{{ item.name }}">
    <div class="card-body">
        <h3>{{ item.name }}</h3>

        {% if item.price < 22 %}
            <span class="badge">🏷️ Sale</span>
        {% endif %}

        <p class="category">{{ item.category }}</p>
        <p class="price">€{{ item.price }}</p>
        <a href="{{ url_for('product') }}" class="btn-small">View Details</a>
    </div>
</div>
    {% endfor %}
</div>

{% endblock %}
